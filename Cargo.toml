[package]
name = "claudio-term"
version = "0.1.0"
edition = "2024"
description = "A terminal UI that aggregates the Claude Code sessions running on your machine"
license = "MIT"
repository = "https://github.com/bertonha/claudio-term"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
libc = "0.2.190"
portable-pty = "0.9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-term = "0.3"
vt100 = "0.16"
